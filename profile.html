<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .card {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #222;
        }

        h2 {
            color: #0066cc;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Henry Mark</h1>

        <h2>Junior Web Designer</h2>

        <p>
            I create simple and responsive websites
            using HTML and CSS.
        </p>

        <button>Contact Me</button>

    </div>

</body>
</html>
